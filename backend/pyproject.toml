[project]
name = "enterprise-support-copilot"
version = "0.2.0"
description = "Evidence-grounded enterprise support copilot with FastAPI, LangGraph, RAG and HITL"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.0,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain>=1.0,<2",
  "langchain-chroma>=0.2,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "evals*", "scripts*"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
